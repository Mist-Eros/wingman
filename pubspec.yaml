name: wingman
description: "Wingman - airport incident reporting: closed taxonomy, local AI classification, live dispatch."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Hardcoded demo-account passwords are stored as salted SHA-256 hashes.
  crypto: ^3.0.3
  # Local notifications: every crew account only gets alerts for its departments.
  flutter_local_notifications: ^19.0.0
  # Web dashboard (desktop control room in Edge; no Visual Studio needed).
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  # Token persistence (optional at hour 0; see lib/core/auth/secure_token_store.dart)
  flutter_secure_storage: ^9.2.2
  flutter_tts: ^4.2.5
  geolocator: ^14.0.2
  record: ^7.1.2
  image_picker: ^1.2.4
dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/certs/ca.crt
    # Application profiles: branding, feature switches, rewards, quorum.
    - config/domains/
